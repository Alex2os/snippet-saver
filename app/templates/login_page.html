<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="static/css/login_register.css" />
    <link rel="stylesheet" href="static/css/global.css" />
</head>

<body>

    <div class="bg" />

    <!-- title -->
    <div class="flex flex-col items-center justify-center h-[11%] text-white">
        <h1 class="text-xl">Log in</h1>
        <p>Use your account to see and manage your saved snippets.</p>
    </div>

    <div class="flex flex-col w-full h-[40%] p-[20px] gap-2 items-center justify-center text-white">

        <div class="flex flex-col justify-center items-center h-[80%] w-[550px] bg-[#03030336]">

            <form class="flex flex-col gap-3 items-center justify-center w-[40%]" method = "POST" action = "/auth/login_user">

                {{ form.hidden_tag() }}

                <div class = "input_wrapper">
                    <p>Username</p>
                    <input name = "username" type="text" placeholder="Enter username" required />
                </div>

                <div class = "input_wrapper">
                    <p>Password</p>
                    <input name = "password" type="password" placeholder="Enter password" required />
                </div>

                <button class = "login_button login">Login</button>

                <a href = "/" class = "login_button return">Return</a>

            </form>

        </div>

    </div>

</body>
